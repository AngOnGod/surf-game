<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Surf</title>
<style>
  :root { --fg: #f3f6fa; --dim: rgba(243, 246, 250, .6); --panel: rgba(13, 18, 28, .9); --line: rgba(255, 255, 255, .1); --accent: #6cb4ff; --good: #4ade80; --bad: #f87171; --gold: #fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f17; color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .75); font-variant-numeric: tabular-nums; }
  #cross { left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #fff; border-radius: 50%; box-shadow: 0 0 2px #000; }
  #speed { left: 50%; bottom: 13vh; transform: translateX(-50%); font-size: 60px; font-weight: 700; letter-spacing: -1px; }
  #speed small { font-size: 16px; font-weight: 500; opacity: .6; margin-left: 6px; letter-spacing: 0; }
  #timer { left: 50%; bottom: calc(13vh + 78px); transform: translateX(-50%); font-size: 22px; text-align: center; white-space: nowrap; }
  #timer .tag { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 8px; vertical-align: 3px; background: rgba(0, 0, 0, .35); }
  #section { left: 50%; top: 16px; transform: translateX(-50%); color: var(--dim); white-space: nowrap; }
  #keys { left: 50%; bottom: 4vh; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 30px) 12px 54px 54px; gap: 4px; }
  #keys span { height: 26px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--dim); background: rgba(0, 0, 0, .25); }
  #keys span.on { background: rgba(255, 255, 255, .85); color: #0b0f17; border-color: #fff; text-shadow: none; }
  #msg { left: 50%; top: 28%; transform: translateX(-50%); font-size: 20px; text-align: center; transition: opacity .35s; white-space: pre; }
  #mode { right: 14px; top: 14px; font-size: 12px; font-weight: 700; color: var(--gold); }
  #debug { left: 10px; top: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; background: rgba(0, 0, 0, .5); padding: 8px 10px; border-radius: 6px; white-space: pre; display: none; }
  .good { color: var(--good); } .bad { color: var(--bad); } .gold { color: var(--gold); }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 14, .55); backdrop-filter: blur(3px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; width: min(600px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
  .panel h1 { margin: 0 0 2px; font-size: 26px; letter-spacing: 2px; }
  .panel h2 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  .panel p { margin: 0 0 12px; color: var(--dim); }
  .map { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; margin: 0 0 8px; }
  .map div { flex: 1; } .map b { display: block; font-size: 15px; } .map span { color: var(--dim); font-size: 12px; }
  .map em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--gold); white-space: nowrap; }
  button, .button { font: inherit; color: var(--fg); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button:hover, .button:hover { background: rgba(108, 180, 255, .18); border-color: rgba(108, 180, 255, .5); }
  button.primary, .button.primary { background: var(--accent); color: #06101e; border-color: var(--accent); font-weight: 700; }
  .panel a { color: var(--accent); } .credits { font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 120px; gap: 6px 12px; align-items: center; }
  .grid input[type=number], .grid input[type=text], .grid select, input.link { width: 100%; font: inherit; color: var(--fg); background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input.link { display: block; margin-top: 6px; font-size: 12px; }
  .board { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  .board th, .board td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .board th:first-child, .board td:first-child { text-align: left; color: var(--dim); }
  .grid label { color: var(--dim); } .grid input[type=checkbox] { justify-self: start; width: 18px; height: 18px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, .1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; color: var(--dim); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="cross"></div>
<div class="hud" id="section"></div>
<div class="hud" id="mode"></div>
<div class="hud" id="timer"></div>
<div class="hud" id="speed"></div>
<div class="hud" id="keys"><span id="kW" style="grid-area:1/2">W</span><span id="kA" style="grid-area:2/1">A</span><span id="kS" style="grid-area:2/2">S</span><span id="kD" style="grid-area:2/3">D</span><span id="kJ" style="grid-area:1/5/3/6">JUMP</span><span id="kC" style="grid-area:1/6/3/7">DUCK</span></div>
<div class="hud" id="msg"></div>
<div class="hud" id="debug"></div>
<div id="menu"><div class="panel" id="panel"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
